name: CI Quality Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality-check:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TELEGRAM_BOT_TOKEN: "mock_ci_bot_token"
      TELEGRAM_CHAT_ID: "mock_ci_chat_id"
      NEXT_PUBLIC_SITE_URL: "https://growbdijital.com"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck (Strict TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit & Integration Tests (Vitest)
        run: npm test

      - name: Internal Link Integrity Audit
        run: npm run check:links

      - name: Production Build (Next.js)
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
